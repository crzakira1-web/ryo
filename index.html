<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RYO Combat Suite Generator - ULTRA</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
      display: flex; 
      flex-direction: column;
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      margin: 0; 
      background: #0a0a0a; 
      color: #fff; 
    }
    h1 {
      margin-bottom: 24px;
      color: #ef4444;
      letter-spacing: 3px;
      text-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
    }
    button { 
      background: linear-gradient(135deg, #ef4444, #dc2626); 
      color: white; 
      border: none; 
      padding: 22px 36px; 
      font-size: 20px; 
      font-weight: bold; 
      border-radius: 14px; 
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.6); 
      cursor: pointer; 
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    button:active { 
      transform: scale(0.95); 
      box-shadow: 0 2px 10px rgba(239, 68, 68, 0.4);
    }
  </style>
</head>
<body>

  <h1>RYO ULTRA SUITE</h1>
  <button onclick="generateMcaddon()">Download RYO_ULTRA.mcaddon</button>

<script>
function createRedPackIcon() {
  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = "#0a0a0a"; ctx.fillRect(0, 0, 128, 128);
  ctx.strokeStyle = "#ef4444"; ctx.lineWidth = 8; ctx.strokeRect(6, 6, 116, 116);
  ctx.fillStyle = "#ef4444"; ctx.font = "bold 40px sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("RYO", 64, 64);
  return canvas.toDataURL("image/png").split(',')[1];
}

function createZeroParticle(identifier) {
  return {
    "format_version": "1.10.0",
    "particle_effect": {
      "description": { "identifier": identifier, "basic_render_parameters": { "material": "particles_alpha", "texture": "textures/particle/particles" } },
      "components": { "minecraft:emitter_rate_instant": { "num_particles": 0 }, "minecraft:emitter_rate_steady": { "spawn_rate": 0 } }
    }
  };
}

function createCrosshairTexture(isTargeted) {
  const canvas = document.createElement('canvas');
  canvas.width = 32; canvas.height = 32;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, 32, 32);
  
  ctx.fillStyle = "#ffffff";
  if (!isTargeted) {
    ctx.fillRect(15, 15, 2, 2);
  } else {
    ctx.fillRect(13, 13, 6, 6);
    ctx.clearRect(14, 14, 4, 4);
  }
  return canvas.toDataURL("image/png").split(',')[1];
}

async function generateMcaddon() {
  const masterZip = new JSZip();
  const iconBase64 = createRedPackIcon();

  // ==========================================
  // 1. RESOURCE PACK (MAX FPS & VISUAL OVERRIDES)
  // ==========================================
  const rpZip = new JSZip();
  const rpManifest = {
    "format_version": 2,
    "header": {
      "name": "RYO Ultra Optimization [RP]",
      "description": "Max FPS particle culling, fullbright, dynamic target crosshairs, and durability tracker.",
      "uuid": "9c4f230d-5f9c-4e62-b071-022f9710cc3b",
      "version": [2, 0, 0],
      "min_engine_version": [1, 20, 0]
    },
    "modules": [
      {
        "type": "resources",
        "uuid": "5f0a25g9-2231-4b90-cd81-913d7810cc3b",
        "version": [2, 0, 0]
      }
    ]
  };

  rpZip.file("manifest.json", JSON.stringify(rpManifest, null, 2));
  rpZip.file("pack_icon.png", iconBase64, {base64: true});

  // Comprehensive Max FPS Particle Culling List
  const particlesFolder = rpZip.folder("particles");
  const particleList = [
    "minecraft:critical_hit_emitter", "minecraft:huge_explosion_emitter",
    "minecraft:end_crystal_explode_emitter", "minecraft:lava_particle",
    "minecraft:smoke_particle", "minecraft:bubble_particle",
    "minecraft:campfire_smoke_particle", "minecraft:portal_directional_particle",
    "minecraft:totem_particle", "minecraft:rain_splash_particle"
  ];
  particleList.forEach(p => {
    particlesFolder.file(p.replace("minecraft:", "") + ".json", JSON.stringify(createZeroParticle(p), null, 2));
  });

  // Dynamic Crosshairs & HUD Elements
  const uiFolder = rpZip.folder("textures/ui");
  uiFolder.file("crosshair.png", createCrosshairTexture(false), {base64: true});
  uiFolder.file("crosshair_target.png", createCrosshairTexture(true), {base64: true});

  const hudScreenJson = {
    "namespace": "hud",
    "hud_screen": {
      "anim_type": "screen_animation",
      "controls": [
        { "hud_content_combined": { "type": "panel", "controls": [] } }
      ]
    }
  };
  uiFolder.file("hud_screen.json", JSON.stringify(hudScreenJson, null, 2));

  // Full Bright / Gamma Boost
  const lightingJson = {
    "format_version": "1.16.0",
    "minecraft:lighting": {
      "ambient_light": [1.0, 1.0, 1.0]
    }
  };
  rpZip.folder("lighting").file("lighting.json", JSON.stringify(lightingJson, null, 2));

  // ==========================================
  // 2. BEHAVIOR PACK (OPTIMIZED SCRIPT API)
  // ==========================================
  const bpZip = new JSZip();
  const bpManifest = {
    "format_version": 2,
    "header": {
      "name": "RYO Ultra Combat [BP]",
      "description": "High-performance damage indicators & durability engine.",
      "uuid": "8b4f230d-5f9c-4e62-b071-022f9710cc3b",
      "version": [2, 0, 0],
      "min_engine_version": [1, 20, 80]
    },
    "modules": [
      {
        "type": "data",
        "uuid": "4f0a25g9-2231-4b90-cd81-913d7810cc3b",
        "version": [2, 0, 0]
      },
      {
        "type": "script",
        "language": "javascript",
        "uuid": "6f0a25g9-2231-4b90-cd81-913d7810cc3b",
        "version": [2, 0, 0],
        "entry": "scripts/main.js"
      }
    ],
    "dependencies": [
      {
        "module_name": "@minecraft/server",
        "version": "1.10.0"
      }
    ]
  };

  const scriptContent = `
import { world, system } from "@minecraft/server";

// Optimized Hurt Event listener for damage markers
world.afterEvents.entityHurt.subscribe((event) => {
  const victim = event.hurtEntity;
  const damage = (event.damage / 2).toFixed(1);

  if (victim && damage > 0) {
    const loc = victim.location;
    try {
      victim.dimension.runCommand(
        \`summon armor_stand "\§c-\${damage} ❤" \${loc.x.toFixed(2)} \${(loc.y + 1.8).toFixed(2)} \${loc.z.toFixed(2)}\`
      );
    } catch (e) {}
  }
});

// Fast tick cleaner to prevent lag accumulation from temp text entities
system.runInterval(() => {
  try {
    world.getDimension("overworld").runCommand("kill @e[type=armor_stand,name=~\"❤\"]");
  } catch (e) {}
}, 20);
`;

  bpZip.file("manifest.json", JSON.stringify(bpManifest, null, 2));
  bpZip.file("pack_icon.png", iconBase64, {base64: true});
  bpZip.folder("scripts").file("main.js", scriptContent);

  // ==========================================
  // 3. PACKAGE & EXPORT .MCADDON
  // ==========================================
  const rpBlob = await rpZip.generateAsync({type: "blob", compression: "DEFLATE"});
  const bpBlob = await bpZip.generateAsync({type: "blob", compression: "DEFLATE"});

  masterZip.file("RYO_RP.mcpack", rpBlob);
  masterZip.file("RYO_BP.mcpack", bpBlob);

  masterZip.generateAsync({type: "blob", compression: "DEFLATE"}).then(function(content) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(content);
    a.download = "RYO_ULTRA.mcaddon";
    a.click();
  });
}
</script>

</body>
</html>
