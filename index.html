<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RYO Optimization Suite</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
      display: flex; 
      flex-direction: column;
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      margin: 0; 
      background: #0a0a0a; 
      color: #fff; 
    }
    h1 {
      margin-bottom: 24px;
      color: #ef4444;
      letter-spacing: 3px;
      text-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
    }
    p {
      color: #888;
      margin-bottom: 20px;
      font-size: 14px;
      letter-spacing: 1px;
    }
    button { 
      background: linear-gradient(135deg, #ef4444, #dc2626); 
      color: white; 
      border: none; 
      padding: 22px 36px; 
      font-size: 20px; 
      font-weight: bold; 
      border-radius: 14px; 
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.6); 
      cursor: pointer; 
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    button:active { 
      transform: scale(0.95); 
      box-shadow: 0 2px 10px rgba(239, 68, 68, 0.4);
    }
  </style>
</head>
<body>

  <h1>RYO OPTIMIZATION SUITE</h1>
  <p>find it out yourself</p>
  <button onclick="generateMcpack()">Download RYO_OPTIMIZE.mcpack</button>

<script>
function createRedPackIcon() {
  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = "#0a0a0a"; ctx.fillRect(0, 0, 128, 128);
  ctx.strokeStyle = "#ef4444"; ctx.lineWidth = 8; ctx.strokeRect(6, 6, 116, 116);
  ctx.fillStyle = "#ef4444"; ctx.font = "bold 40px sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("RYO", 64, 64);
  return canvas.toDataURL("image/png").split(',')[1];
}

function createZeroParticle(identifier) {
  return {
    "format_version": "1.10.0",
    "particle_effect": {
      "description": { "identifier": identifier, "basic_render_parameters": { "material": "particles_alpha", "texture": "textures/particle/particles" } },
      "components": { "minecraft:emitter_rate_instant": { "num_particles": 0 }, "minecraft:emitter_rate_steady": { "spawn_rate": 0 } }
    }
  };
}

async function generateMcpack() {
  const packZip = new JSZip();
  const iconBase64 = createRedPackIcon();

  const manifest = {
    "format_version": 2,
    "header": {
      "name": "RYO Performance Pack [RP]",
      "description": "find it out yourself",
      "uuid": "7c4f230d-5f9c-4e62-b071-022f9710cc3b",
      "version": [5, 0, 0],
      "min_engine_version": [1, 20, 0]
    },
    "modules": [
      {
        "type": "resources",
        "uuid": "3f0a25g9-2231-4b90-cd81-913d7810cc3b",
        "version": [5, 0, 0]
      }
    ]
  };

  packZip.file("manifest.json", JSON.stringify(manifest, null, 2));
  packZip.file("pack_icon.png", iconBase64, {base64: true});

  // Exhaustive particle culling purge for zero GPU render overhead
  const particlesFolder = packZip.folder("particles");
  const particleList = [
    "minecraft:critical_hit_emitter", "minecraft:huge_explosion_emitter",
    "minecraft:end_crystal_explode_emitter", "minecraft:lava_particle",
    "minecraft:smoke_particle", "minecraft:bubble_particle",
    "minecraft:campfire_smoke_particle", "minecraft:portal_directional_particle",
    "minecraft:totem_particle", "minecraft:rain_splash_particle",
    "minecraft:firework_particle", "minecraft:firework_rocket_particle",
    "minecraft:firework_spark_particle", "minecraft:water_splash_particle",
    "minecraft:underwater_particle"
  ];
  particleList.forEach(p => {
    particlesFolder.file(p.replace("minecraft:", "") + ".json", JSON.stringify(createZeroParticle(p), null, 2));
  });

  // Maximized water and lava clear vision bounds
  const renderSettings = {
    "format_version": "1.16.0",
    "minecraft:client_environment": {
      "fog_distance": { "water": 64.0, "lava": 64.0 }
    }
  };
  packZip.folder("environments").file("overworld.json", JSON.stringify(renderSettings, null, 2));

  packZip.generateAsync({type: "blob", compression: "DEFLATE", compressionOptions: {level: 9}}).then(function(content) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(content);
    a.download = "RYO_OPTIMIZE.mcpack";
    a.click();
  });
}
</script>

</body>
</html>
